    <style>
        :root {
            --primary-navy: #0B224B;
            --dark-navy: #061530;
            --primary-pink: #E41A6D;
            --dark-pink: #c2125a;
            --accent-yellow: #FDB913;
            --bg-color: #f0f3f8;
            --text-color: #1e2430;
        }

        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 15px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(11, 34, 75, 0.12);
            border-top: 5px solid var(--primary-navy);
        }

        /* Header Banner */
        .header-banner {
            text-align: center;
            border-bottom: 3px solid var(--primary-pink);
            padding-bottom: 15px;
            margin-bottom: 18px;
            position: relative;
        }

        .header-banner img {
            max-width: 100%;
            height: auto;
            max-height: 140px;
            object-fit: contain;
            display: block;
            margin: 0 auto;
        }

        .logo-upload-btn {
            display: inline-block;
            margin-top: 8px;
            font-size: 11px;
            color: var(--primary-navy);
            cursor: pointer;
            background: #eef2f9;
            padding: 4px 12px;
            border-radius: 4px;
            border: 1px solid #c5d1e8;
            font-weight: 600;
        }

        .fallback-header {
            display: none;
            text-align: center;
        }

        .fallback-header h1 {
            font-size: 32px;
            font-weight: 900;
            letter-spacing: 1.5px;
            color: var(--primary-navy);
        }

        .fallback-header h1 span {
            color: var(--primary-pink);
        }

        .fallback-header h3 {
            font-size: 14px;
            color: #222;
            letter-spacing: 3px;
            margin-top: 3px;
            font-weight: 700;
        }

        .fallback-header .tagline-pill {
            display: inline-block;
            background: var(--primary-navy);
            color: #fff;
            padding: 5px 18px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
            margin-top: 6px;
            border-bottom: 3px solid var(--accent-yellow);
        }

        /* Navigation Tabs */
        .nav-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            background: #eef2f9;
            padding: 6px;
            border-radius: 8px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            background: transparent;
            color: var(--primary-navy);
            transition: all 0.25s ease;
        }

        .tab-btn.active {
            background: var(--primary-navy);
            color: #ffffff;
            box-shadow: 0 3px 8px rgba(11, 34, 75, 0.25);
        }

        .tab-btn.active.pink-tab {
            background: var(--primary-pink);
            color: #ffffff;
            box-shadow: 0 3px 8px rgba(228, 26, 109, 0.25);
        }

        /* Form & Grid Styles */
        .meta-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
            background: #f4f7fc;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #d5dfef;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-size: 12px;
            font-weight: bold;
            color: var(--primary-navy);
            margin-bottom: 5px;
        }

        .form-group input, .form-group select {
            padding: 9px;
            border: 1px solid #c3cde0;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            background: #fff;
        }

        .form-group input:focus, .form-group select:focus {
            border-color: var(--primary-pink);
            box-shadow: 0 0 0 2px rgba(228, 26, 109, 0.12);
        }

        .item-box {
            background: #fdf6f9;
            border: 1px solid #f7d2e2;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .item-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(135px, 1fr));
            gap: 10px;
        }

        .btn-add {
            background-color: var(--primary-pink);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
            font-size: 15px;
            transition: background 0.2s;
        }

        .btn-add:hover {
            background-color: var(--dark-pink);
        }

        .btn-navy {
            background-color: var(--primary-navy);
            color: white;
        }

        .btn-navy:hover {
            background-color: var(--dark-navy);
        }

        /* Item List Manager */
        .item-manager-box {
            background: #eef2f9;
            border: 1px solid #c5d1e8;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .item-manager-box h4 {
            color: var(--primary-navy);
            margin-bottom: 10px;
            font-size: 14px;
        }

        .item-manager-grid {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        .item-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }

        .tag {
            background: #fff;
            border: 1px solid var(--primary-navy);
            color: var(--primary-navy);
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .tag span {
            color: var(--primary-pink);
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }

        /* Tables */
        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }

        th, td {
            border: 1px solid #d5dfef;
            padding: 9px;
            text-align: left;
            font-size: 14px;
        }

        th {
            background-color: var(--primary-navy);
            color: white;
        }

        /* Payment Summary */
        .payment-summary-section {
            background: #f4f7fc;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #d5dfef;
            margin-bottom: 20px;
        }

        .payment-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        .summary-box {
            font-size: 16px;
            font-weight: bold;
            padding: 10px;
            border-radius: 6px;
            background: #ffffff;
            border: 1px solid #c3cde0;
        }

        .summary-box.grand-total {
            color: var(--primary-navy);
            border-color: var(--primary-navy);
        }

        .summary-box.balance-due {
            color: var(--primary-pink);
            border-color: var(--primary-pink);
        }

        .qr-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #fff;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #d5dfef;
            flex-wrap: wrap;
            gap: 15px;
        }

        .qr-box {
            text-align: center;
        }

        .qr-box img {
            width: 110px;
            height: 110px;
            display: block;
        }

        .qr-box span {
            font-size: 11px;
            font-weight: bold;
            color: var(--primary-navy);
        }

        /* Action Buttons */
        .action-btns {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            flex: 1;
            min-width: 150px;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            font-size: 14px;
            color: white;
        }

        .btn-save { background-color: #1b7a43; }
        .btn-print { background-color: var(--primary-navy); }
